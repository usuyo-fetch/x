[package]
name = "usuyo-fetch-x"
description = "usuyo 的 X（推特）获取插件：按帖子链接取公开帖子的正文、图片、视频和引用的帖子，不用账号，做个人备份和离线阅读"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

# 独立仓库，不并进别的工作区。
[workspace]

[[bin]]
name = "usuyo-fetch-x"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
usuyo-plugin-kit = { path = "../../usuyo/crates/usuyo-plugin-kit" }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
usuyo-plugin = { path = "../../usuyo/crates/usuyo-plugin" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
